<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 4 - Texturizado Dinámico y Partículas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 10px;
            color: white;
            max-width: 320px;
            max-height: 85vh;
            overflow-y: auto;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        #controls h2 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #4a9eff;
            border-bottom: 2px solid #4a9eff;
            padding-bottom: 8px;
        }
        
        .control-group {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .control-group:last-child {
            border-bottom: none;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #4a9eff;
        }
        
        .control-group button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #4a9eff;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .control-group button:hover {
            background: #3a7ed0;
            transform: translateY(-2px);
        }
        
        .control-group button.active {
            background: #ffa94a;
        }
        
        .slider-container {
            margin-top: 8px;
        }
        
        .slider-container label {
            font-size: 11px;
            font-weight: normal;
            color: #ccc;
        }
        
        .slider-container input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        
        .value-display {
            font-size: 11px;
            color: #4a9eff;
            float: right;
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 11px;
            max-width: 300px;
            backdrop-filter: blur(10px);
        }
        
        #info h3 {
            color: #4a9eff;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        #info p {
            margin: 5px 0;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <h2>Punto 4: Texturizado Dinámico</h2>
        
        <!-- 1. Materiales Reactivos -->
        <div class="control-group">
            <label>Materiales Reactivos</label>
            <button id="btn-reactive-time" class="active">Reactivo a Tiempo</button>
            <button id="btn-reactive-input">Reactivo a Input (Mouse)</button>
            <button id="btn-reactive-sensor">Reactivo a Sensor (Scroll)</button>
        </div>
        
        <!-- 2. Mapas Animados -->
        <div class="control-group">
            <label>Mapas Animados</label>
            <button id="btn-emissive">Emissive Animado</button>
            <button id="btn-normal">Normal Map Animado</button>
            <button id="btn-uv-offset">UV Offset Animado</button>
            <button id="btn-noise">Ruido Animado</button>
        </div>
        
        <!-- 3. Sistema de Partículas -->
        <div class="control-group">
            <label>Partículas Sincronizadas</label>
            <button id="btn-particles-toggle">Toggle Partículas</button>
            <div class="slider-container">
                <label>Cantidad: <span id="particle-count-val" class="value-display">1000</span></label>
                <input type="range" id="particle-count" min="100" max="5000" step="100" value="1000">
            </div>
        </div>
        
        <!-- 4. Evento Visual Coordinado -->
        <div class="control-group">
            <label>Evento Visual Coordinado</label>
            <button id="btn-explosion">Explosión (Shader + Partículas)</button>
            <button id="btn-implosion">Implosión (Shader + Partículas)</button>
            <button id="btn-pulse">Pulso (Shader + Partículas)</button>
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let mainObject, particleSystem;
        let clock = new THREE.Clock();
        
        // Input tracking
        let mouse = new THREE.Vector2(0.5, 0.5);
        let scrollAmount = 0;
        
        // Material uniforms
        let materialUniforms = {
            time: { value: 0 },
            mouseX: { value: 0.5 },
            mouseY: { value: 0.5 },
            scroll: { value: 0 },
            emissiveIntensity: { value: 0 },
            normalIntensity: { value: 1.0 },
            uvOffsetX: { value: 0 },
            uvOffsetY: { value: 0 },
            noiseScale: { value: 1.0 },
            explosionFactor: { value: 0 }
        };
        
        // Particle uniforms
        let particleUniforms = {
            time: { value: 0 },
            particleSize: { value: 0.05 },
            explosionFactor: { value: 0 },
            color: { value: new THREE.Color(0x4a9eff) }
        };
        
        let particlesVisible = true;
        let currentMode = 'time';
        let currentMap = 'none';

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 3, 5);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(5, 8, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040, 1.0));
            
            // Create main object and particles
            createMainObject('time');
            createParticleSystem(1000);
            
            // Event Listeners
            setupEventListeners();
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('wheel', onWheel);
        }

        function createMainObject(mode) {
            if (mainObject) scene.remove(mainObject);
            
            const geometry = new THREE.TorusKnotGeometry(1.5, 0.5, 128, 32);
            let material;
            
            currentMode = mode;
            
            // Base material with animated maps
            material = new THREE.ShaderMaterial({
                uniforms: materialUniforms,
                vertexShader: `
                    uniform float time;
                    uniform float mouseX;
                    uniform float mouseY;
                    uniform float scroll;
                    uniform float normalIntensity;
                    uniform float uvOffsetX;
                    uniform float uvOffsetY;
                    uniform float noiseScale;
                    uniform float explosionFactor;
                    
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    // Noise function
                    float noise(vec3 p) {
                        return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453);
                    }
                    
                    void main() {
                        vUv = uv + vec2(uvOffsetX, uvOffsetY);
                        vNormal = normal;
                        vPosition = position;
                        
                        vec3 pos = position;
                        
                        // Normal map animation (vertex displacement)
                        float normalWave = sin(pos.x * 5.0 + time * 2.0) * cos(pos.y * 5.0 + time * 2.0);
                        pos += normal * normalWave * normalIntensity * 0.1;
                        
                        // Noise animation
                        float n = noise(pos * noiseScale + time * 0.5);
                        pos += normal * n * 0.1;
                        
                        // Explosion effect
                        pos += normal * explosionFactor;
                        
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    uniform float mouseX;
                    uniform float mouseY;
                    uniform float scroll;
                    uniform float emissiveIntensity;
                    uniform float noiseScale;
                    
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    float noise(vec2 p) {
                        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
                    }
                    
                    void main() {
                        vec3 baseColor = vec3(0.29, 0.62, 1.0); // Blue
                        vec3 emissiveColor = vec3(1.0, 0.66, 0.29); // Orange
                        
                        // Different reactive modes
                        float reactivity = 0.0;
                        
                        ${mode === 'time' ? `
                            // Reactive to time
                            reactivity = sin(time * 2.0) * 0.5 + 0.5;
                        ` : mode === 'input' ? `
                            // Reactive to mouse input
                            vec2 mousePos = vec2(mouseX, mouseY);
                            float dist = distance(vUv, mousePos);
                            reactivity = 1.0 - smoothstep(0.0, 0.5, dist);
                        ` : mode === 'sensor' ? `
                            // Reactive to scroll sensor
                            reactivity = scroll;
                        ` : ''}
                        
                        // Emissive map animation
                        float emissive = sin(vUv.x * 10.0 + time * 3.0) * cos(vUv.y * 10.0 + time * 3.0);
                        emissive = emissive * 0.5 + 0.5;
                        
                        // UV offset creates scrolling effect
                        float uvPattern = step(0.5, fract(vUv.x * 10.0)) * step(0.5, fract(vUv.y * 10.0));
                        
                        // Noise animation
                        float n = noise(vUv * noiseScale * 10.0 + time);
                        
                        // Combine effects
                        vec3 finalColor = mix(baseColor, emissiveColor, reactivity);
                        finalColor += emissiveColor * emissive * emissiveIntensity;
                        finalColor = mix(finalColor, vec3(1.0), uvPattern * 0.2);
                        finalColor += vec3(n * 0.3);
                        
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `
            });
            
            mainObject = new THREE.Mesh(geometry, material);
            scene.add(mainObject);
        }

        function createParticleSystem(count) {
            if (particleSystem) scene.remove(particleSystem);
            
            const positions = new Float32Array(count * 3);
            const velocities = new Float32Array(count * 3);
            
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                // Spawn particles around the sphere
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const radius = 1.5 + Math.random() * 0.5;
                
                positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i3 + 2] = radius * Math.cos(phi);
                
                velocities[i3] = (Math.random() - 0.5) * 0.02;
                velocities[i3 + 1] = (Math.random() - 0.5) * 0.02;
                velocities[i3 + 2] = (Math.random() - 0.5) * 0.02;
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
            
            const material = new THREE.ShaderMaterial({
                uniforms: particleUniforms,
                vertexShader: `
                    uniform float time;
                    uniform float particleSize;
                    uniform float explosionFactor;
                    
                    attribute vec3 velocity;
                    
                    varying vec3 vColor;
                    
                    void main() {
                        vec3 pos = position;
                        
                        // Orbit around center
                        float angle = time * 0.5;
                        mat3 rotation = mat3(
                            cos(angle), 0.0, sin(angle),
                            0.0, 1.0, 0.0,
                            -sin(angle), 0.0, cos(angle)
                        );
                        pos = rotation * pos;
                        
                        // Add velocity
                        pos += velocity * time;
                        
                        // Synchronized with material explosion
                        vec3 direction = normalize(pos);
                        pos += direction * explosionFactor * 3.0;
                        
                        vColor = vec3(1.0, 0.66, 0.29); // Orange
                        
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_PointSize = particleSize * (300.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform vec3 color;
                    uniform float time;
                    
                    varying vec3 vColor;
                    
                    void main() {
                        float dist = distance(gl_PointCoord, vec2(0.5));
                        if (dist > 0.5) discard;
                        
                        float alpha = 1.0 - (dist * 2.0);
                        vec3 finalColor = vColor * (0.8 + sin(time * 5.0) * 0.2);
                        
                        gl_FragColor = vec4(finalColor, alpha);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            
            particleSystem = new THREE.Points(geometry, material);
            particleSystem.visible = particlesVisible;
            scene.add(particleSystem);
        }

        function triggerEvent(eventType) {
            const duration = 2.0; // seconds
            const startTime = clock.getElapsedTime();
            
            function animateEvent() {
                const elapsed = clock.getElapsedTime() - startTime;
                const progress = Math.min(elapsed / duration, 1.0);
                
                switch(eventType) {
                    case 'explosion':
                        // Expand then contract
                        const explosionValue = Math.sin(progress * Math.PI) * 2.0;
                        materialUniforms.explosionFactor.value = explosionValue;
                        particleUniforms.explosionFactor.value = explosionValue;
                        materialUniforms.emissiveIntensity.value = explosionValue * 0.5;
                        break;
                        
                    case 'implosion':
                        // Contract then expand
                        const implosionValue = -Math.sin(progress * Math.PI) * 2.0;
                        materialUniforms.explosionFactor.value = implosionValue;
                        particleUniforms.explosionFactor.value = implosionValue;
                        materialUniforms.emissiveIntensity.value = Math.abs(implosionValue) * 0.5;
                        break;
                        
                    case 'pulse':
                        // Multiple pulses
                        const pulseValue = Math.sin(progress * Math.PI * 4.0) * 0.8;
                        materialUniforms.explosionFactor.value = pulseValue;
                        particleUniforms.explosionFactor.value = pulseValue;
                        materialUniforms.emissiveIntensity.value = Math.abs(pulseValue);
                        break;
                }
                
                if (progress < 1.0) {
                    requestAnimationFrame(animateEvent);
                } else {
                    // Reset
                    materialUniforms.explosionFactor.value = 0;
                    particleUniforms.explosionFactor.value = 0;
                    materialUniforms.emissiveIntensity.value = 0;
                }
            }
            
            animateEvent();
        }

        function setupEventListeners() {
            // 1. Materiales reactivos
            document.getElementById('btn-reactive-time').addEventListener('click', () => {
                createMainObject('time');
                setActiveButton('btn-reactive-time', ['btn-reactive-input', 'btn-reactive-sensor']);
            });
            document.getElementById('btn-reactive-input').addEventListener('click', () => {
                createMainObject('input');
                setActiveButton('btn-reactive-input', ['btn-reactive-time', 'btn-reactive-sensor']);
            });
            document.getElementById('btn-reactive-sensor').addEventListener('click', () => {
                createMainObject('sensor');
                setActiveButton('btn-reactive-sensor', ['btn-reactive-time', 'btn-reactive-input']);
            });
            
            // 2. Mapas animados
            document.getElementById('btn-emissive').addEventListener('click', () => {
                materialUniforms.emissiveIntensity.value = 1.0;
                materialUniforms.normalIntensity.value = 0;
                materialUniforms.uvOffsetX.value = 0;
                materialUniforms.uvOffsetY.value = 0;
                materialUniforms.noiseScale.value = 1.0;
                setActiveButton('btn-emissive', ['btn-normal', 'btn-uv-offset', 'btn-noise']);
            });
            document.getElementById('btn-normal').addEventListener('click', () => {
                materialUniforms.emissiveIntensity.value = 0;
                materialUniforms.normalIntensity.value = 2.0;
                materialUniforms.uvOffsetX.value = 0;
                materialUniforms.uvOffsetY.value = 0;
                materialUniforms.noiseScale.value = 1.0;
                setActiveButton('btn-normal', ['btn-emissive', 'btn-uv-offset', 'btn-noise']);
            });
            document.getElementById('btn-uv-offset').addEventListener('click', () => {
                materialUniforms.emissiveIntensity.value = 0;
                materialUniforms.normalIntensity.value = 0;
                materialUniforms.noiseScale.value = 1.0;
                setActiveButton('btn-uv-offset', ['btn-emissive', 'btn-normal', 'btn-noise']);
            });
            document.getElementById('btn-noise').addEventListener('click', () => {
                materialUniforms.emissiveIntensity.value = 0;
                materialUniforms.normalIntensity.value = 0;
                materialUniforms.uvOffsetX.value = 0;
                materialUniforms.uvOffsetY.value = 0;
                materialUniforms.noiseScale.value = 5.0;
                setActiveButton('btn-noise', ['btn-emissive', 'btn-normal', 'btn-uv-offset']);
            });
            
            // 3. Partículas
            document.getElementById('btn-particles-toggle').addEventListener('click', () => {
                particlesVisible = !particlesVisible;
                if (particleSystem) particleSystem.visible = particlesVisible;
                document.getElementById('btn-particles-toggle').classList.toggle('active');
            });
            document.getElementById('particle-count').addEventListener('input', (e) => {
                const count = parseInt(e.target.value);
                createParticleSystem(count);
                particleSystem.visible = particlesVisible;
                document.getElementById('particle-count-val').textContent = count;
            });
            
            // 4. Eventos coordinados
            document.getElementById('btn-explosion').addEventListener('click', () => {
                triggerEvent('explosion');
            });
            document.getElementById('btn-implosion').addEventListener('click', () => {
                triggerEvent('implosion');
            });
            document.getElementById('btn-pulse').addEventListener('click', () => {
                triggerEvent('pulse');
            });
        }

        function setActiveButton(activeId, inactiveIds) {
            document.getElementById(activeId).classList.add('active');
            inactiveIds.forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
        }

        function onMouseMove(event) {
            mouse.x = event.clientX / window.innerWidth;
            mouse.y = 1.0 - (event.clientY / window.innerHeight);
            materialUniforms.mouseX.value = mouse.x;
            materialUniforms.mouseY.value = mouse.y;
        }

        function onWheel(event) {
            scrollAmount += event.deltaY * 0.001;
            scrollAmount = Math.max(0, Math.min(1, scrollAmount));
            materialUniforms.scroll.value = scrollAmount;
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            materialUniforms.time.value = time;
            particleUniforms.time.value = time;
            
            // UV offset animation
            materialUniforms.uvOffsetX.value = Math.sin(time * 0.5) * 0.5;
            materialUniforms.uvOffsetY.value = Math.cos(time * 0.7) * 0.5;
            
            if (mainObject) {
                mainObject.rotation.y += 0.005;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
