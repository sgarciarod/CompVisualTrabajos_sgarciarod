<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 3 - Shaders Personalizados</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 10px;
            color: white;
            max-width: 320px;
            max-height: 85vh;
            overflow-y: auto;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        #controls h2 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #4a9eff;
            border-bottom: 2px solid #4a9eff;
            padding-bottom: 8px;
        }
        
        .control-group {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .control-group:last-child {
            border-bottom: none;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #4a9eff;
        }
        
        .control-group button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #4a9eff;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .control-group button:hover {
            background: #3a7ed0;
            transform: translateY(-2px);
        }
        
        .control-group button.active {
            background: #ffa94a;
        }
        
        .value-display {
            font-size: 11px;
            color: #4a9eff;
            float: right;
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 11px;
            max-width: 300px;
            backdrop-filter: blur(10px);
        }
        
        #info h3 {
            color: #4a9eff;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        #info p {
            margin: 5px 0;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <h2>Punto 3: Custom Shaders</h2>
        
        <!-- 1. Shaders Básicos GLSL -->
        <div class="control-group">
            <label>Shaders Básicos (GLSL)</label>
            <button id="btn-toon" class="active">Toon Shading</button>
            <button id="btn-gradient">Gradientes</button>
            <button id="btn-wireframe">Wireframe</button>
        </div>
        
        <!-- 2. Color por Posición/Tiempo/Interacción -->
        <div class="control-group">
            <label>Color Dinámico</label>
            <button id="btn-color-position">Color por Posición</button>
            <button id="btn-color-time">Color por Tiempo</button>
            <button id="btn-color-interaction">Color por Interacción (Mouse)</button>
        </div>
        
        <!-- 3. Distorsión UV -->
        <div class="control-group">
            <label>Distorsión UV</label>
            <button id="btn-uv-distort">UV Distortion</button>
        </div>
        
        <!-- 4. Texturizado Procedural -->
        <div class="control-group">
            <label>Texturizado Procedural</label>
            <button id="btn-procedural">Procedural Texture</button>
            <button id="btn-mixed-maps">Mezcla de Mapas</button>
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let mainObject;
        let clock = new THREE.Clock();
        let mouse = new THREE.Vector2();

        // Uniforms compartidos
        let uniforms = {
            time: { value: 0 },
            mouse: { value: new THREE.Vector2(0.5, 0.5) }
        };

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 3, 5);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Basic lighting
            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(5, 8, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040, 1.0));
            
            // Create object with default shader (Toon)
            applyShader('toon');
            
            // Event Listeners
            setupEventListeners();
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
        }

        function applyShader(type) {
            if (mainObject) scene.remove(mainObject);
            
            const geometry = new THREE.TorusKnotGeometry(1.5, 0.5, 128, 32);
            let material;
            
            switch(type) {
                case 'toon':
                    material = getToonShader();
                    break;
                case 'gradient':
                    material = getGradientShader();
                    break;
                case 'wireframe':
                    material = getWireframeShader();
                    break;
                case 'color-position':
                    material = getColorByPositionShader();
                    break;
                case 'color-time':
                    material = getColorByTimeShader();
                    break;
                case 'color-interaction':
                    material = getColorByInteractionShader();
                    break;
                case 'uv-distort':
                    material = getUVDistortShader();
                    break;
                case 'procedural':
                    material = getProceduralTextureShader();
                    break;
                case 'mixed-maps':
                    material = getMixedMapsShader();
                    break;
            }
            
            mainObject = new THREE.Mesh(geometry, material);
            scene.add(mainObject);
        }

        // ============================================
        // 1. SHADERS BÁSICOS (GLSL)
        // ============================================
        
        // Toon Shading
        function getToonShader() {
            return new THREE.ShaderMaterial({
                uniforms: {
                    lightPos: { value: new THREE.Vector3(5, 8, 5) }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 lightPos;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        vec3 lightDir = normalize(lightPos - vPosition);
                        float intensity = dot(vNormal, lightDir);
                        
                        // Discrete toon steps
                        vec3 color;
                        if (intensity > 0.95) {
                            color = vec3(0.29, 0.62, 1.0); // Bright blue
                        } else if (intensity > 0.5) {
                            color = vec3(0.2, 0.45, 0.7); // Mid blue
                        } else if (intensity > 0.25) {
                            color = vec3(0.1, 0.3, 0.5); // Dark blue
                        } else {
                            color = vec3(0.05, 0.15, 0.3); // Shadow
                        }
                        
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            });
        }
        
        // Gradientes
        function getGradientShader() {
            return new THREE.ShaderMaterial({
                uniforms: {
                    time: uniforms.time
                },
                vertexShader: `
                    varying vec3 vPosition;
                    
                    void main() {
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    varying vec3 vPosition;
                    
                    void main() {
                        // Vertical gradient with animation
                        float gradient = (vPosition.y + 2.0) / 4.0;
                        gradient = sin(gradient * 3.14159 + time) * 0.5 + 0.5;
                        
                        vec3 color1 = vec3(0.29, 0.62, 1.0);  // Blue
                        vec3 color2 = vec3(1.0, 0.66, 0.29);  // Orange
                        vec3 color = mix(color1, color2, gradient);
                        
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            });
        }
        
        // Wireframe
        function getWireframeShader() {
            return new THREE.ShaderMaterial({
                uniforms: {
                    time: uniforms.time
                },
                vertexShader: `
                    varying vec3 vPosition;
                    
                    void main() {
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    varying vec3 vPosition;
                    
                    void main() {
                        // Grid-based wireframe effect
                        vec3 grid = fract(vPosition * 5.0);
                        float thickness = 0.05;
                        
                        float edge = step(grid.x, thickness) + step(grid.y, thickness) + step(grid.z, thickness);
                        edge = min(edge, 1.0);
                        
                        vec3 color = vec3(0.29, 0.62, 1.0) * (0.3 + edge * 0.7);
                        color *= (1.0 + sin(time * 2.0) * 0.2); // Pulse
                        
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            });
        }

        // ============================================
        // 2. COLOR POR POSICIÓN/TIEMPO/INTERACCIÓN
        // ============================================
        
        // Color por Posición
        function getColorByPositionShader() {
            return new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vPosition;
                    
                    void main() {
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vPosition;
                    
                    void main() {
                        // Map position to color (normalize to 0-1 range)
                        vec3 color = (vPosition + 2.0) / 4.0;
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            });
        }
        
        // Color por Tiempo
        function getColorByTimeShader() {
            return new THREE.ShaderMaterial({
                uniforms: {
                    time: uniforms.time
                },
                vertexShader: `
                    varying vec3 vPosition;
                    
                    void main() {
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    varying vec3 vPosition;
                    
                    void main() {
                        // RGB cycle over time
                        float r = sin(time) * 0.5 + 0.5;
                        float g = sin(time + 2.094) * 0.5 + 0.5; // 120 degrees
                        float b = sin(time + 4.189) * 0.5 + 0.5; // 240 degrees
                        
                        gl_FragColor = vec4(r, g, b, 1.0);
                    }
                `
            });
        }
        
        // Color por Interacción (Mouse)
        function getColorByInteractionShader() {
            return new THREE.ShaderMaterial({
                uniforms: {
                    mouse: uniforms.mouse
                },
                vertexShader: `
                    varying vec3 vPosition;
                    varying vec2 vUv;
                    
                    void main() {
                        vPosition = position;
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec2 mouse;
                    varying vec3 vPosition;
                    varying vec2 vUv;
                    
                    void main() {
                        // Color based on mouse position
                        float dist = distance(vUv, mouse);
                        
                        vec3 color1 = vec3(0.29, 0.62, 1.0);  // Blue
                        vec3 color2 = vec3(1.0, 0.66, 0.29);  // Orange
                        
                        float factor = smoothstep(0.0, 1.0, dist);
                        vec3 color = mix(color2, color1, factor);
                        
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            });
        }

        // ============================================
        // 3. DISTORSIÓN UV
        // ============================================
        
        function getUVDistortShader() {
            return new THREE.ShaderMaterial({
                uniforms: {
                    time: uniforms.time
                },
                vertexShader: `
                    varying vec2 vUv;
                    
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    varying vec2 vUv;
                    
                    void main() {
                        // UV distortion with sine waves
                        vec2 distortedUV = vUv;
                        distortedUV.x += sin(vUv.y * 10.0 + time) * 0.1;
                        distortedUV.y += cos(vUv.x * 10.0 + time * 1.3) * 0.1;
                        
                        // Checkerboard pattern
                        vec2 grid = fract(distortedUV * 8.0);
                        float checker = step(0.5, grid.x) + step(0.5, grid.y);
                        checker = mod(checker, 2.0);
                        
                        vec3 color1 = vec3(0.29, 0.62, 1.0);
                        vec3 color2 = vec3(1.0, 0.66, 0.29);
                        vec3 color = mix(color1, color2, checker);
                        
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            });
        }

        // ============================================
        // 4. TEXTURIZADO PROCEDURAL / MEZCLA DE MAPAS
        // ============================================
        
        // Texturizado Procedural
        function getProceduralTextureShader() {
            return new THREE.ShaderMaterial({
                uniforms: {
                    time: uniforms.time
                },
                vertexShader: `
                    varying vec3 vPosition;
                    varying vec2 vUv;
                    
                    void main() {
                        vPosition = position;
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    varying vec3 vPosition;
                    varying vec2 vUv;
                    
                    // Simple noise function
                    float noise(vec2 p) {
                        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
                    }
                    
                    float smoothNoise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        
                        float a = noise(i);
                        float b = noise(i + vec2(1.0, 0.0));
                        float c = noise(i + vec2(0.0, 1.0));
                        float d = noise(i + vec2(1.0, 1.0));
                        
                        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                    }
                    
                    // Fractal Brownian Motion
                    float fbm(vec2 p) {
                        float value = 0.0;
                        float amplitude = 0.5;
                        
                        for (int i = 0; i < 4; i++) {
                            value += amplitude * smoothNoise(p);
                            p *= 2.0;
                            amplitude *= 0.5;
                        }
                        
                        return value;
                    }
                    
                    void main() {
                        vec2 p = vPosition.xy + time * 0.1;
                        
                        float n = fbm(p * 3.0);
                        
                        vec3 color1 = vec3(0.29, 0.62, 1.0);
                        vec3 color2 = vec3(1.0, 0.66, 0.29);
                        vec3 color = mix(color1, color2, n);
                        
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            });
        }
        
        // Mezcla de Mapas Dinámicos
        function getMixedMapsShader() {
            return new THREE.ShaderMaterial({
                uniforms: {
                    time: uniforms.time
                },
                vertexShader: `
                    varying vec3 vPosition;
                    varying vec3 vNormal;
                    varying vec2 vUv;
                    
                    void main() {
                        vPosition = position;
                        vNormal = normalize(normalMatrix * normal);
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    varying vec3 vPosition;
                    varying vec3 vNormal;
                    varying vec2 vUv;
                    
                    float noise(vec2 p) {
                        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
                    }
                    
                    void main() {
                        // Map 1: Position-based
                        vec3 posColor = (vPosition + 2.0) / 4.0;
                        
                        // Map 2: UV checkerboard
                        vec2 grid = fract(vUv * 8.0);
                        float checker = step(0.5, grid.x) + step(0.5, grid.y);
                        checker = mod(checker, 2.0);
                        vec3 uvColor = vec3(checker);
                        
                        // Map 3: Noise
                        float n = noise(vPosition.xy * 5.0 + time * 0.5);
                        vec3 noiseColor = vec3(n);
                        
                        // Dynamic blend based on time
                        float blend1 = sin(time) * 0.5 + 0.5;
                        float blend2 = cos(time * 1.3) * 0.5 + 0.5;
                        
                        vec3 temp = mix(posColor, uvColor, blend1);
                        vec3 finalColor = mix(temp, noiseColor, blend2);
                        
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `
            });
        }

        function setupEventListeners() {
            // 1. Shaders básicos
            document.getElementById('btn-toon').addEventListener('click', () => {
                applyShader('toon');
                setActiveButton('btn-toon');
            });
            document.getElementById('btn-gradient').addEventListener('click', () => {
                applyShader('gradient');
                setActiveButton('btn-gradient');
            });
            document.getElementById('btn-wireframe').addEventListener('click', () => {
                applyShader('wireframe');
                setActiveButton('btn-wireframe');
            });
            
            // 2. Color dinámico
            document.getElementById('btn-color-position').addEventListener('click', () => {
                applyShader('color-position');
                setActiveButton('btn-color-position');
            });
            document.getElementById('btn-color-time').addEventListener('click', () => {
                applyShader('color-time');
                setActiveButton('btn-color-time');
            });
            document.getElementById('btn-color-interaction').addEventListener('click', () => {
                applyShader('color-interaction');
                setActiveButton('btn-color-interaction');
            });
            
            // 3. Distorsión UV
            document.getElementById('btn-uv-distort').addEventListener('click', () => {
                applyShader('uv-distort');
                setActiveButton('btn-uv-distort');
            });
            
            // 4. Texturizado procedural
            document.getElementById('btn-procedural').addEventListener('click', () => {
                applyShader('procedural');
                setActiveButton('btn-procedural');
            });
            document.getElementById('btn-mixed-maps').addEventListener('click', () => {
                applyShader('mixed-maps');
                setActiveButton('btn-mixed-maps');
            });
        }

        function setActiveButton(activeId) {
            document.querySelectorAll('#controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(activeId).classList.add('active');
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth);
            mouse.y = 1.0 - (event.clientY / window.innerHeight);
            uniforms.mouse.value.set(mouse.x, mouse.y);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            uniforms.time.value = clock.getElapsedTime();
            
            if (mainObject) {
                mainObject.rotation.x += 0.005;
                mainObject.rotation.y += 0.01;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
